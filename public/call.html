<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your meeting with Nuren Media</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#1b1147; --blush:#f7b5c4; --cream:#fff7ef; --line:#e7dfd1; --ink-2:#3b3064; }
  * { box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,system-ui,sans-serif; color:var(--ink); background:var(--cream); margin:0; padding:32px 16px; min-height:100vh; }
  .card { max-width:560px; margin:24px auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px; box-shadow:0 6px 24px rgba(27,17,71,0.05) }
  .brand { font-weight:800; font-size:18px; color:var(--ink); margin-bottom:6px }
  .brand span { color:var(--blush) }
  h1 { font-size:24px; font-weight:700; margin:8px 0 14px; line-height:1.2 }
  .sub { color:var(--ink-2); font-size:14px; margin:0 0 18px; line-height:1.6 }
  .meta { background:var(--cream); padding:16px; border-radius:12px; margin:18px 0; font-size:14px; }
  .meta strong { display:block; margin-bottom:4px; font-size:12px; color:var(--ink-2); text-transform:uppercase; letter-spacing:0.04em }
  .cta { display:inline-block; background:var(--ink); color:#fff; padding:14px 26px; border-radius:999px; text-decoration:none; font-weight:600; font-size:15px; margin-top:6px }
  .moat { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:24px }
  .moat div { background:#fff7ef; border:1px solid var(--line); padding:12px; border-radius:10px; font-size:12px; color:var(--ink-2); text-align:center }
  .moat strong { display:block; color:var(--ink); margin-bottom:2px }
  footer { text-align:center; color:#7b708f; font-size:12px; margin-top:18px }
  .err { background:#fde2e2; color:#a12525; padding:14px; border-radius:10px; font-size:13.5px }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Nuren <span>Media</span></div>
  <div id="content">Loading…</div>
</div>
<footer>Nuren Group · Motherhood · Kelab Mama · Ibuencer · Parentcraft</footer>

<script>
(async () => {
  const token = location.pathname.split('/').pop();
  const root = document.getElementById('content');
  try {
    const res = await fetch('/api/public/call/' + token);
    if (!res.ok) throw new Error((await res.json()).error || 'Meeting not found');
    const a = await res.json();
    const when = new Date(a.scheduled_at + 'Z').toLocaleString('en-MY', { dateStyle: 'full', timeStyle: 'short' });
    root.innerHTML = '';
    const h1 = document.createElement('h1');
    h1.textContent = a.title || 'Your call with Nuren Media';
    const sub = document.createElement('p');
    sub.className = 'sub';
    sub.innerHTML = 'Hosted by <strong>' + (a.host_name || 'Nuren Media') + '</strong> · ' + a.duration_minutes + ' minutes';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<strong>When</strong>' + when;
    if (a.notes) {
      const n = document.createElement('div');
      n.className = 'meta';
      n.innerHTML = '<strong>Agenda</strong>' + a.notes.replace(/[<>]/g, '');
      root.append(h1, sub, meta, n);
    } else {
      root.append(h1, sub, meta);
    }
    const cta = document.createElement('a');
    cta.href = a.meet_link;
    cta.target = '_blank';
    cta.className = 'cta';
    cta.textContent = 'Join Google Meet';
    root.append(cta);

    const moat = document.createElement('div');
    moat.className = 'moat';
    moat.innerHTML = '<div><strong>5M+</strong>parenting users</div><div><strong>MY · SG · TH</strong>active markets</div><div><strong>Ibuencer</strong>KOL marketplace</div>';
    root.append(moat);
  } catch (e) {
    root.innerHTML = '<div class="err">' + e.message + '</div>';
  }
})();
</script>
</body>
</html>
